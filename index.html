<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزرو آنلاین پیرایش سالار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/yekan-bakh@main/css/yekan-bakh.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://tapi.bale.ai/static/js/bale-miniapp.js"></script>
    <style>body { font-family: 'Yekan Bakh', sans-serif; background-color: #0f172a; color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4">

    <div class="w-full max-w-md bg-slate-900 rounded-3xl p-4 border border-slate-800 flex flex-col h-[700px] justify-between">
        
        <div class="space-y-4">
            <div class="bg-slate-800 p-3 rounded-2xl flex items-center justify-between text-xs">
                <span class="font-bold text-white">✂️ رزرو آنلاین پیرایش سالار</span>
            </div>

            <div id="formSection" class="space-y-3 text-xs">
                <div>
                    <label class="block mb-1 text-slate-300">نام و نام خانوادگی:</label>
                    <input type="text" id="custName" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="block mb-1 text-slate-300">شماره همراه:</label>
                    <input type="tel" id="custPhone" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="block mb-1 text-slate-300">خدمت:</label>
                    <select id="custService" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        <option value="اصلاح مو">اصلاح مو (۲۵۰ هزار تومان)</option>
                        <option value="اصلاح سر و صورت">اصلاح سر و صورت (۳۵۰ هزار تومان)</option>
                    </select>
                </div>
            </div>

            <div id="resultSection" class="hidden text-center py-8 space-y-4">
                <i class="fa-solid fa-circle-check text-emerald-400 text-5xl"></i>
                <h3 class="text-sm font-bold text-white">اطلاعات رزرو آماده شد</h3>
                <a id="baleSendBtn" href="#" class="block w-full py-3 bg-emerald-500 text-white rounded-xl font-bold text-xs">
                    تأیید و ارسال در بله
                </a>
            </div>
        </div>

        <button id="submitBtn" onclick="submitBooking()" class="w-full py-3 rounded-xl bg-emerald-500 text-white text-xs font-bold">
            ثبت و دریافت لینک ارسال
        </button>
    </div>

    <script>
        function submitBooking() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const service = document.getElementById('custService').value;

            if (!name || !phone) {
                alert('لطفاً نام و شماره همراه را وارد کنید.');
                return;
            }

            const text = `💈 نوبت جدید پیرایش سالار\n👤 مشتری: ${name}\n📞 تلفن: ${phone}\n✂️ خدمت: ${service}`;

            // ۱. تلاش برای ارسال مستقیم با WebApp
            if (window.Bale && window.Bale.WebApp && window.Bale.WebApp.sendData) {
                window.Bale.WebApp.sendData(text);
                return;
            }

            // ۲. ساخت لینک چت مستقیم در بله در صورت عدم پشتیبانی مرورگر
            const baleUrl = `https://ble.ir/testpirbot?text=${encodeURIComponent(text)}`;
            document.getElementById('baleSendBtn').href = baleUrl;

            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('submitBtn').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
