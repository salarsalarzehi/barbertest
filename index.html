<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رزرو آنلاین پیرایش سالار</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="https://tapi.bale.ai/miniapp.js?3"></script>
  <style>
    body { 
      font-family: 'Vazirmatn', sans-serif !important; 
      background-color: #0f172a; 
      color: #f8fafc;
      font-size: 14px;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4">
  
 <div class="w-full max-w-md bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border border-slate-800 flex flex-col h-[640px] relative">
  
   <div class="bg-slate-800 px-4 py-3 flex items-center justify-between border-b border-slate-700 text-xs text-slate-300">
      <div class="flex items-center space-x-2 space-x-reverse">
        <div class="w-8 h-8 rounded-full overflow-hidden border-2 border-emerald-400 flex-shrink-0 shadow-sm">
          <img src="https://raw.githubusercontent.com/salarsalarzehi/barbertest/main/profile.jpg" alt="سالار" class="w-full h-full object-cover">
        </div>
        <span class="font-bold text-white text-sm">پیرایش سالار</span>
      </div>
      <span class="text-[11px] bg-emerald-500/10 text-emerald-400 px-2.5 py-0.5 rounded-full border border-emerald-500/20 font-medium">
        مینی‌اپ بله
      </span>
    </div>
  
   <div class="flex-1 overflow-y-auto p-3.5 space-y-3.5 custom-scrollbar" id="mainContainer">
  
      <div id="stepHeaderBox" class="flex items-center justify-between px-3 bg-slate-800/40 p-2.5 rounded-2xl border border-slate-800">
        <div class="flex items-center gap-2">
          <div id="stepBadge" class="w-6 h-6 rounded-full bg-emerald-500 text-white font-bold flex items-center justify-center text-xs">۱</div>
          <span id="stepTitle" class="text-xs font-bold text-slate-200">انتخاب خدمت مورد نظر</span>
        </div>
      </div>
  
      <!-- لیست خدمات که به صورت پویا از سرور بارگذاری می‌شود -->
      <div id="step1" class="space-y-2.5">
        <p class="text-xs text-slate-500 text-center py-4">در حال بارگذاری خدمات...</p>
      </div>
  
      <div id="step2" class="space-y-3 hidden">
        <div>
          <label class="block text-xs text-slate-300 mb-1.5 font-medium">روز مراجعه:</label>
          <div class="flex gap-2 overflow-x-auto pb-1.5 custom-scrollbar" id="dateContainer"></div>
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1.5 font-medium">ساعت حضور:</label>
          <div class="grid grid-cols-2 gap-2" id="timeContainer"></div>
        </div>
      </div>
  
      <div id="step3" class="space-y-3 hidden">
        <div>
          <label class="block text-xs text-slate-300 mb-1 font-medium">نام و نام خانوادگی:</label>
          <input type="text" id="custName" placeholder="مثلا: علی محمدی" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
       </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1 font-medium">شماره همراه (الزامی):</label>
          <input type="tel" id="custPhone" dir="ltr" placeholder="09123456789" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white text-right focus:outline-none focus:border-emerald-500">
          <p id="phoneError" class="text-xs text-rose-400 mt-1 hidden">لطفاً شماره موبایل معتبر وارد کنید (مثل 09123456789)</p>
       </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1 font-medium">توضیحات (اختیاری):</label>
          <textarea id="custNote" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"></textarea>
        </div>
      </div>
  
      <div id="successState" class="text-center py-8 space-y-3.5 hidden">
        <i class="fa-solid fa-circle-check text-emerald-400 text-5xl"></i>
        <h2 class="text-sm font-bold text-white">نوبت شما با موفقیت ثبت شد</h2>
        <p class="text-xs text-slate-400 leading-relaxed">اطلاعات برای آرایشگر ارسال گردید و ساعت مورد نظر قفل شد.</p>
  
        <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs text-slate-400 space-y-2">
          <p>طراحی و توسعه:</p>
          <div>
            <a href="#" onclick="openSalarProfile(event)" class="inline-block bg-slate-800 border border-slate-700 px-4 py-1.5 rounded-xl text-emerald-400 font-bold hover:bg-slate-700 transition cursor-pointer" dir="ltr">@salarx8</a>
          </div>
        </div>
      </div>
  
   </div>
  
   <div id="bottomBar" class="p-3.5 bg-slate-900 border-t border-slate-800 flex gap-2">
      <button id="backBtn" onclick="prevStep()" class="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hidden cursor-pointer hover:bg-slate-700 transition">بازگشت</button>
     <button id="nextBtn" onclick="nextStep()" disabled class="w-full py-2.5 rounded-xl bg-slate-800 text-slate-500 text-xs font-bold transition">ادامه</button>
   </div>
  
 </div>
  
 <script>
    const WORKER_URL = "https://bale-sender.salar1368yb.workers.dev";
    
    // پایه تمام سانس‌ها بر اساس بلوک‌های ۳۰ دقیقه‌ای چیده می‌شود
    const halfHourSlots = [
      { start: "۱۰:۰۰", end: "۱۰:۳۰" }, { start: "۱۰:۳۰", end: "۱۱:۰۰" }, 
      { start: "۱۱:۰۰", end: "۱۱:۳۰" }, { start: "۱۱:۳۰", end: "۱۲:۰۰" }, 
      { start: "۱۲:۰۰", end: "۱۲:۳۰" }, { start: "۱۲:۳۰", end: "۱۳:۰۰" }, 
      { start: "۱۶:۰۰", end: "۱۶:۳۰" }, { start: "۱۶:۳۰", end: "۱۷:۰۰" }, 
      { start: "۱۷:۰۰", end: "۱۷:۳۰" }, { start: "۱۷:۳۰", end: "۱۸:۰۰" }, 
      { start: "۱۸:۰۰", end: "۱۸:۳۰" }, { start: "۱۸:۳۰", end: "۱۹:۰۰" }, 
      { start: "۱۹:۰۰", end: "۱۹:۳۰" }, { start: "۱۹:۳۰", end: "۲۰:۰۰" }
    ];

    let step = 1, service = "", serviceDuration = 60, servicePrice = "", date = "", time = "";
    let disabledSlots = [];
    let servicesList = [];
    let userChatId = null;
  
    try {
      if (window.Bale && window.Bale.WebApp) {
        window.Bale.WebApp.ready();
        window.Bale.WebApp.expand();
        const webApp = window.Bale.WebApp;
        if (webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
          userChatId = webApp.initDataUnsafe.user.id;
        }
      }
    } catch(e) {
      console.error("Bale Init Error:", e);
    }

    async function loadServices() {
      try {
        const res = await fetch(`${WORKER_URL}/services`);
        const data = await res.json();
        servicesList = data.services || [
          { name: "اصلاح و استایل مو", duration: 60, price: "۲۵۰,۰۰۰ تومان" },
          { name: "اصلاح کامل سر و صورت", duration: 60, price: "۳۵۰,۰۰۰ تومان" },
          { name: "اصلاح ریش", duration: 30, price: "۱۵۰,۰۰۰ تومان" }
        ];
        renderServices();
      } catch(e) {
        console.error("Error loading services:", e);
        servicesList = [
          { name: "اصلاح و استایل مو", duration: 60, price: "۲۵۰,۰۰۰ تومان" },
          { name: "اصلاح کامل سر و صورت", duration: 60, price: "۳۵۰,۰۰۰ تومان" },
          { name: "اصلاح ریش", duration: 30, price: "۱۵۰,۰۰۰ تومان" }
        ];
        renderServices();
      }
    }

    function renderServices() {
      const container = document.getElementById('step1');
      container.innerHTML = '';
      servicesList.forEach(s => {
        const div = document.createElement('div');
        div.className = "service-card p-3.5 rounded-xl bg-slate-800 border border-slate-700 hover:border-emerald-500 cursor-pointer flex items-center justify-between transition";
        div.innerHTML = `
          <div>
            <h3 class="text-sm font-semibold text-white">${s.name}</h3>
            <p class="text-xs text-slate-400 mt-1">مدت زمان: ${s.duration} دقیقه</p>
          </div>
          <span class="text-xs font-bold text-emerald-400">${s.price}</span>
        `;
        div.onclick = () => selectService(div, s.name, s.duration, s.price);
        container.appendChild(div);
      });
    }
  
    function openSalarProfile(e) {
      e.preventDefault();
      const url = "https://ble.ir/salarx8";
      try {
        if (window.Bale && window.Bale.WebApp && typeof window.Bale.WebApp.openExternalLink === 'function') {
          window.Bale.WebApp.openExternalLink(url);
        } else {
          window.open(url, '_blank');
        }
      } catch (err) {
        window.open(url, '_blank');
      }
    }
  
    async function fetchDisabledSlots() {
      try {
        const res = await fetch(`${WORKER_URL}/disabled-slots`);
        const data = await res.json();
        disabledSlots = data.disabledSlots || [];
      } catch(e) {
        console.error("خطا در دریافت سانس‌ها:", e);
      }
    }
  
    function selectService(el, sName, duration, price) {
      document.querySelectorAll('.service-card').forEach(e => e.classList.remove('border-emerald-500', 'bg-emerald-500/10'));
      el.classList.add('border-emerald-500', 'bg-emerald-500/10');
      service = sName;
      serviceDuration = duration;
      servicePrice = price;

      const btn = document.getElementById('nextBtn');
      btn.disabled = false;
      btn.className = "w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold cursor-pointer transition";
    }
  
    function renderCalendar() {
      const container = document.getElementById('dateContainer');
      container.innerHTML = '';
      for (let i = 0; i < 7; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        const str = d.toLocaleDateString('fa-IR', { weekday: 'short', month: 'short', day: 'numeric' });
        if (i === 0 && !date) date = str;
        const b = document.createElement('button');
        b.className = `date-btn flex-shrink-0 p-2.5 rounded-xl border text-xs min-w-[75px] cursor-pointer transition ${
          date === str ? 'border-emerald-500 text-emerald-400 bg-slate-800 font-bold' : 'border-slate-700 bg-slate-800 text-white hover:border-slate-600'
        }`;
        b.innerText = str;
        b.onclick = () => {
          date = str;
          time = "";
          renderCalendar();
          renderTimes();
          document.getElementById('nextBtn').disabled = true;
          document.getElementById('nextBtn').className = "w-full py-2.5 rounded-xl bg-slate-800 text-slate-500 text-xs font-bold";
        };
        container.appendChild(b);
      }
    }
  
    function timeToMinutes(tStr) {
      const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
      let englishStr = tStr;
      persianDigits.forEach((p, i) => {
        englishStr = englishStr.replace(new RegExp(p, 'g'), i);
      });
      const parts = englishStr.split(':');
      return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    }

    function renderTimes() {
      const container = document.getElementById('timeContainer');
      container.innerHTML = '';
      
      // تعداد اسلات‌های ۳۰ دقیقه‌ای مورد نیاز بسته به زمان خدمت (مثلا ۶۰ دقیقه = ۲ اسلات)
      const slotsNeeded = serviceDuration / 30;

      // ساخت لیست بازه‌های پویای قابل ارائه بر اساس مدت زمان خدمت
      const availableTimes = [];
      for (let i = 0; i <= halfHourSlots.length - slotsNeeded; i++) {
        const startSlot = halfHourSlots[i];
        const endSlot = halfHourSlots[i + slotsNeeded - 1];

        // جلوگیری از ترکیب بازه‌هایی که متعلق به شیفت‌های جداگانه هستند (مثلاً بین ظهر و عصر)
        const startTimeVal = timeToMinutes(startSlot.start);
        const endTimeVal = timeToMinutes(endSlot.end);
        if (endTimeVal - startTimeVal !== serviceDuration) continue;

        // بررسی اینکه آیا بین این بازه‌ها وقفه ناهار/استراحت افتاده یا نه
        let isValidRange = true;
        for (let j = 0; j < slotsNeeded; j++) {
          const checkSlotKey = `${date}_${halfHourSlots[i + j].start} - ${halfHourSlots[i + j].end}`;
          if (disabledSlots.includes(checkSlotKey)) {
            isValidRange = false;
            break;
          }
        }

        const tLabel = `${startSlot.start} - ${endSlot.end}`;
        availableTimes.push({ label: tLabel, disabled: !isValidRange });
      }

      availableTimes.forEach(item => {
        const b = document.createElement('button');
        if (item.disabled) {
          b.className = "time-btn p-2.5 rounded-xl border border-slate-800 bg-slate-900/50 text-xs text-slate-600 cursor-not-allowed flex items-center justify-between";
          b.innerHTML = `<span dir="ltr">${item.label}</span><span>(تکمیل)</span>`;
          b.disabled = true;
        } else {
          b.className = `time-btn p-2.5 rounded-xl border text-xs cursor-pointer transition flex items-center justify-center ${
            time === item.label ? 'border-emerald-500 text-emerald-400 bg-slate-800 font-bold' : 'border-slate-700 bg-slate-800 text-white hover:border-slate-600'
          }`;
          b.innerHTML = `<span dir="ltr">${item.label}</span>`;
          b.onclick = () => {
            time = item.label;
            renderTimes();
            checkStep2();
          };
        }
        container.appendChild(b);
      });
    }
  
    function checkStep2() {
      if (date && time) {
        const btn = document.getElementById('nextBtn');
        btn.disabled = false;
        btn.className = "w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold cursor-pointer transition";
      }
    }
  
    function isValidIranianMobile(phone) {
      const mobileRegex = /^(09[0-9]{9}|\+989[0-9]{9})$/;
      return mobileRegex.test(phone);
    }
  
    async function finalizeBooking(bookingObj, adminText, userText, slotsToDisable) {
      try {
        slotsToDisable.forEach(subKey => {
          if (!disabledSlots.includes(subKey)) {
            disabledSlots.push(subKey);
          }
        });
  
        await fetch(`${WORKER_URL}/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            adminText: adminText,
            userChatId: userChatId,
            userText: userText,
            bookingInfo: bookingObj
          })
        });
  
        await fetch(`${WORKER_URL}/disabled-slots`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ disabledSlots })
        });
  
      } catch (err) {
        console.error("خطا در ثبت نهایی:", err);
      } finally {
        setTimeout(() => {
          if (window.Bale && window.Bale.WebApp) {
            window.Bale.WebApp.close();
          }
        }, 6000);
      }
    }
  
    async function nextStep() {
      if (step === 1) {
        step = 2;
        await fetchDisabledSlots();
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        document.getElementById('backBtn').classList.remove('hidden');
        document.getElementById('stepBadge').innerText = '۲';
        document.getElementById('stepTitle').innerText = 'انتخاب زمان';
        renderCalendar();
        renderTimes();
        const btn = document.getElementById('nextBtn');
        btn.disabled = true;
        btn.className = "w-full py-2.5 rounded-xl bg-slate-800 text-slate-500 text-xs font-bold";
      } 
      else if (step === 2) {
        step = 3;
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step3').classList.remove('hidden');
        document.getElementById('stepBadge').innerText = '۳';
        document.getElementById('stepTitle').innerText = 'اطلاعات تماس';
        document.getElementById('nextBtn').innerText = 'ثبت نهایی رزرو';
        document.getElementById('nextBtn').disabled = false;
        document.getElementById('nextBtn').className = "w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold cursor-pointer transition";
      } 
      else if (step === 3) {
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        const note = document.getElementById('custNote').value.trim() || "ندارد";
        const phoneError = document.getElementById('phoneError');
        const phoneInput = document.getElementById('custPhone');
  
        phoneError.classList.add('hidden');
        phoneInput.classList.remove('border-rose-500');
  
        if (!name) {
          alert('لطفاً نام و نام خانوادگی خود را وارد کنید.');
          return;
        }
  
        if (!phone || !isValidIranianMobile(phone)) {
          phoneError.classList.remove('hidden');
          phoneInput.classList.add('border-rose-500');
          phoneInput.focus();
          return;
        }
  
        const bookingObj = { name, phone, service, date, time, note, price: servicePrice, id: Date.now() };

        // استخراج و قفل کردن تمام بازه‌های ۳۰ دقیقه‌ای که این خدمت اشغال می‌کند
        const slotsToDisable = [];
        const parts = time.split(" - ");
        if (parts.length === 2) {
          const startMin = timeToMinutes(parts[0]);
          const endMin = timeToMinutes(parts[1]);

          halfHourSlots.forEach(hs => {
            const hsStart = timeToMinutes(hs.start);
            const hsEnd = timeToMinutes(hs.end);
            if (hsStart >= startMin && hsEnd <= endMin) {
              slotsToDisable.push(`${date}_${hs.start} - ${hs.end}`);
            }
          });
        }

        const adminText = `💈 **نوبت جدید در پیرایش سالار**\n\n` +
          `👤 مشتری: ${name}\n` +
          `📞 تلفن: ${phone}\n` +
          `✂️ خدمت: ${service} (${servicePrice})\n` +
          `⏰ زمان: ${date} (${time})\n` +
          `📝 توضیحات: ${note}`;
  
        const userText = `✅ **رزرو شما با موفقیت ثبت شد!**\n\n` +
          `سلام ${name} عزیز،\n` +
          `نوبت شما برای خدمت **${service}** (${servicePrice}) در تاریخ **${date} ساعت ${time}** ثبت گردید.\n\n` +
          `منتظر حضور شما در پیرایش سالار هستیم!✂️`;
  
        document.getElementById('step3').classList.add('hidden');
        document.getElementById('stepHeaderBox').classList.add('hidden');
        document.getElementById('bottomBar').classList.add('hidden');
        document.getElementById('successState').classList.remove('hidden');
  
        finalizeBooking(bookingObj, adminText, userText, slotsToDisable);
      }
    }
  
    function prevStep() {
      if (step === 2) {
        step = 1;
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step1').classList.remove('hidden');
        document.getElementById('backBtn').classList.add('hidden');
        document.getElementById('stepBadge').innerText = '۱';
        document.getElementById('stepTitle').innerText = 'انتخاب خدمت مورد نظر';
        document.getElementById('nextBtn').innerText = 'ادامه';
      } else if (step === 3) {
        step = 2;
        document.getElementById('step3').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        document.getElementById('stepBadge').innerText = '۲';
        document.getElementById('stepTitle').innerText = 'انتخاب زمان';
        document.getElementById('nextBtn').innerText = 'ادامه';
      }
    }

    loadServices();
  </script>
</body>
</html>
