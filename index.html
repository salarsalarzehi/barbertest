<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزرو نوبت پیرایش سالار</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between max-w-md mx-auto p-4">

    <!-- Top Header -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
        <div class="flex items-center gap-3">
            <button id="backBtn" onclick="prevStep()" class="hidden text-slate-400 hover:text-white cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                </svg>
            </button>
            <div>
                <h1 class="text-sm font-bold">پیرایش سالار</h1>
                <p class="text-xs text-slate-400" id="stepTitle">انتخاب خدمت مورد نظر</p>
            </div>
        </div>
        <span class="bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/20">مرحله <span id="stepBadge">۱</span> از ۳</span>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1">
        <!-- Step 1: Services -->
        <div id="step1" class="space-y-3">
            <div onclick="selectService(this, 'کوتاهی مو')" class="service-card p-4 rounded-2xl border border-slate-800 bg-slate-900 flex justify-between items-center cursor-pointer transition">
                <div>
                    <h3 class="text-sm font-bold">کوتاهی مو</h3>
                    <p class="text-xs text-slate-400 mt-1">اصلاح تخصصی به همراه استایل</p>
                </div>
                <span class="text-xs font-bold text-emerald-400">انتخاب</span>
            </div>
            <div onclick="selectService(this, 'اصلاح ریش')" class="service-card p-4 rounded-2xl border border-slate-800 bg-slate-900 flex justify-between items-center cursor-pointer transition">
                <div>
                    <h3 class="text-sm font-bold">اصلاح ریش</h3>
                    <p class="text-xs text-slate-400 mt-1">فرم‌دهی و اصلاح با تیغ</p>
                </div>
                <span class="text-xs font-bold text-emerald-400">انتخاب</span>
            </div>
            <div onclick="selectService(this, 'پکیج کامل (مو و ریش)')" class="service-card p-4 rounded-2xl border border-slate-800 bg-slate-900 flex justify-between items-center cursor-pointer transition">
                <div>
                    <h3 class="text-sm font-bold">پکیج کامل (مو و ریش)</h3>
                    <p class="text-xs text-slate-400 mt-1">کوتاهی مو + اصلاح ریش</p>
                </div>
                <span class="text-xs font-bold text-emerald-400">انتخاب</span>
            </div>
        </div>

        <!-- Step 2: Date & Time -->
        <div id="step2" class="hidden space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">انتخاب روز:</label>
                <div id="dateContainer" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none"></div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">انتخاب ساعت:</label>
                <div id="timeContainer" class="grid grid-cols-2 gap-2"></div>
            </div>
        </div>

        <!-- Step 3: User Info -->
        <div id="step3" class="hidden space-y-3">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">نام و نام خانوادگی:</label>
                <input type="text" id="custName" placeholder="مثال: علی رضایی" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">شماره تماس:</label>
                <input type="tel" id="custPhone" placeholder="مثال: 09123456789" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">توضیحات یا مدل دلخواه (اختیاری):</label>
                <textarea id="custNote" placeholder="مدل کوتاهی یا نکات خاص..." class="w-full p-3 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white focus:outline-none focus:border-emerald-500 h-20 resize-none"></textarea>
            </div>
        </div>

        <!-- Success State -->
        <div id="successState" class="hidden text-center py-10 space-y-4">
            <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
            <h2 class="text-base font-bold">رزرو شما با موفقیت ثبت شد!</h2>
            <p class="text-xs text-slate-400">جزئیات نوبت از طریق ربات بله برای شما ارسال شد.</p>
        </div>
    </main>

    <!-- Bottom Action Bar -->
    <footer id="bottomBar" class="pt-4 border-t border-slate-800 mt-4">
        <button id="nextBtn" onclick="nextStep()" disabled class="w-full py-3 rounded-xl bg-slate-800 text-slate-500 text-xs font-bold cursor-not-allowed">
            ادامه با سرویس انتخابی
        </button>
    </footer>

    <!-- JavaScript Code -->
    <script>
        const WORKER_URL = "https://bale-sender.salar1368yb.workers.dev";
        const times = ["۱۰:۰۰ - ۱۱:۰۰", "۱۱:۰۰ - ۱۲:۰۰", "۱۶:۰۰ - ۱۷:۰۰", "۱۷:۰۰ - ۱۸:۰۰", "۱۸:۰۰ - ۱۹:۰۰"];
        let step = 1, service = "", date = "", time = "";
        let disabledSlots = [];

        // 🎯 گرفتن آیدی مستقیم از لینک مینی‌اپ که ربات فرستاده است
        const urlParams = new URLSearchParams(window.location.search);
        let userChatId = urlParams.get('chat_id');
        console.log("آیدی گرفته شده از لینک:", userChatId);

        async function fetchDisabledSlots() {
            try {
                const res = await fetch(`${WORKER_URL}/disabled-slots`);
                const data = await res.json();
                disabledSlots = data.disabledSlots || [];
            } catch(e) {}
        }

        function selectService(el, sName) {
            document.querySelectorAll('.service-card').forEach(e => e.classList.remove('border-emerald-500', 'bg-emerald-500/10'));
            el.classList.add('border-emerald-500', 'bg-emerald-500/10');
            service = sName;
            const btn = document.getElementById('nextBtn');
            btn.disabled = false;
            btn.className = "w-full py-3 rounded-xl bg-emerald-500 text-white text-xs font-bold cursor-pointer";
        }

        function renderCalendar() {
            const container = document.getElementById('dateContainer');
            container.innerHTML = '';
            for (let i = 0; i < 7; i++) {
                const d = new Date(); d.setDate(d.getDate() + i);
                const str = d.toLocaleDateString('fa-IR', { weekday: 'short', month: 'short', day: 'numeric' });
                if (i === 0 && !date) date = str;

                const b = document.createElement('button');
                b.className = `date-btn flex-shrink-0 p-2.5 rounded-xl border text-xs min-w-[75px] cursor-pointer ${
                    date === str ? 'border-emerald-500 text-emerald-400 bg-slate-800' : 'border-slate-700 bg-slate-800 text-white'
                }`;
                b.innerText = str;
                b.onclick = () => {
                    date = str;
                    time = ""; 
                    renderCalendar();
                    renderTimes();
                    document.getElementById('nextBtn').disabled = true;
                    document.getElementById('nextBtn').className = "w-full py-3 rounded-xl bg-slate-800 text-slate-500 text-xs font-bold";
                };
                container.appendChild(b);
            }
        }

        function renderTimes() {
            const container = document.getElementById('timeContainer');
            container.innerHTML = '';
            times.forEach(t => {
                const key = `${date}_${t}`;
                const isDisabled = disabledSlots.includes(key);
                const b = document.createElement('button');
                
                if (isDisabled) {
                    b.className = "time-btn p-2.5 rounded-xl border border-slate-800 bg-slate-900/50 text-xs text-slate-600 cursor-not-allowed";
                    b.innerText = `${t} (تکمیل)`;
                    b.disabled = true;
                } else {
                    b.className = `time-btn p-2.5 rounded-xl border text-xs cursor-pointer ${
                        time === t ? 'border-emerald-500 text-emerald-400 bg-slate-800' : 'border-slate-700 bg-slate-800 text-white'
                    }`;
                    b.innerText = t;
                    b.onclick = () => {
                        time = t;
                        renderTimes();
                        checkStep2();
                    };
                }
                container.appendChild(b);
            });
        }

        function checkStep2() {
            if (date && time) {
                const btn = document.getElementById('nextBtn');
                btn.disabled = false;
                btn.className = "w-full py-3 rounded-xl bg-emerald-500 text-white text-xs font-bold cursor-pointer";
            }
        }

        async function finalizeBooking(bookingObj, adminText, userText) {
            try {
                await fetch(`${WORKER_URL}/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        adminText: adminText,
                        userText: userText,
                        userChatId: userChatId,
                        bookingInfo: bookingObj
                    })
                });
            } catch (err) {} 
            finally {
                setTimeout(() => {
                    if (window.Bale && window.Bale.WebApp && typeof window.Bale.WebApp.close === 'function') {
                        window.Bale.WebApp.close();
                    }
                }, 2000);
            }
        }

        async function nextStep() {
            if (step === 1) {
                step = 2;
                await fetchDisabledSlots(); 
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                document.getElementById('backBtn').classList.remove('hidden');
                document.getElementById('stepBadge').innerText = '۲';
                document.getElementById('stepTitle').innerText = 'انتخاب زمان';
                renderCalendar(); 
                renderTimes();
                const btn = document.getElementById('nextBtn');
                btn.disabled = true; 
                btn.className = "w-full py-3 rounded-xl bg-slate-800 text-slate-500 text-xs font-bold";
            } else if (step === 2) {
                step = 3;
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
                document.getElementById('stepBadge').innerText = '۳';
                document.getElementById('stepTitle').innerText = 'اطلاعات تماس';
                document.getElementById('nextBtn').innerText = 'ثبت نهایی رزرو';
                document.getElementById('nextBtn').disabled = false;
                document.getElementById('nextBtn').className = "w-full py-3 rounded-xl bg-emerald-500 text-white text-xs font-bold cursor-pointer";
            } else if (step === 3) {
                const name = document.getElementById('custName').value.trim();
                const phone = document.getElementById('custPhone').value.trim();
                const note = document.getElementById('custNote').value.trim() || "ندارد";
                
                if (!name || !phone) return alert('لطفاً نام و شماره تلفن را وارد کنید.');

                const bookingObj = { name, phone, service, date, time, note, id: Date.now() };
                
                const adminText = `💈 **نوبت جدید در پیرایش سالار**\n\n` +
                                  `👤 مشتری: ${name}\n` +
                                  `📞 تلفن: ${phone}\n` +
                                  `✂️ خدمت: ${service}\n` +
                                  `⏰ زمان: ${date} (${time})\n` +
                                  `📝 توضیحات: ${note}`;

                const userText = `✅ **رزرو شما با موفقیت ثبت شد!**\n\n` +
                                 `سلام ${name} عزیز،\n` +
                                 `نوبت شما برای خدمت **${service}** در تاریخ **${date} ساعت ${time}** ثبت گردید.\n\n` +
                                 `منتظر حضور شما در پیرایش سالار هستیم! ✂️`;

                document.getElementById('step3').classList.add('hidden');
                document.getElementById('bottomBar').classList.add('hidden');
                document.getElementById('successState').classList.remove('hidden');

                finalizeBooking(bookingObj, adminText, userText);
            }
        }

        function prevStep() {
            if (step === 2) {
                step = 1;
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step1').classList.remove('hidden');
                document.getElementById('backBtn').classList.add('hidden');
                document.getElementById('stepBadge').innerText = '۱';
                document.getElementById('stepTitle').innerText = 'انتخاب خدمت مورد نظر';
                document.getElementById('nextBtn').innerText = 'ادامه با سرویس انتخابی';
            } else if (step === 3) {
                step = 2;
                document.getElementById('step3').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                document.getElementById('stepBadge').innerText = '۲';
                document.getElementById('stepTitle').innerText = 'انتخاب زمان';
                document.getElementById('nextBtn').innerText = 'ادامه';
            }
        }
    </script>
</body>
</html>
