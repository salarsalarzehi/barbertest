<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزرو نوبت - پیرایش آرمین (سالار)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/yekan-bakh@main/css/yekan-bakh.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body { font-family: 'Yekan Bakh', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="p-4 max-w-xl mx-auto space-y-6">

    <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 text-center space-y-2">
        <h1 class="text-lg font-bold text-white"><i class="fa-solid fa-scissors text-emerald-400 ml-2"></i>پیرایش آرمین</h1>
        <p class="text-xs text-slate-400">ساعت کاری: ۱۰:۰۰ صبح تا ۲۲:۰۰ شب</p>
    </div>

    <!-- فرم رزرو -->
    <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
        <h2 class="text-xs font-bold text-slate-300 border-b border-slate-800 pb-2">
            <i class="fa-solid fa-calendar-days text-cyan-400 ml-1"></i> فرم ثبت نوبت آنلاین
        </h2>

        <!-- انتخاب خدمت -->
        <div>
            <label class="block text-xs text-slate-400 mb-2">انتخاب خدمت:</label>
            <select id="serviceSelect" onchange="onServiceChange()" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white">
                <option value="اصلاح سر (کوتاهی)|30">اصلاح سر (زمان: ۳۰ دقیقه)</option>
                <option value="اصلاح کامل سر و ریش|60">اصلاح کامل سر و ریش (زمان: ۶۰ دقیقه)</option>
                <option value="اصلاح ریش|30">اصلاح ریش (زمان: ۳۰ دقیقه)</option>
            </select>
        </div>

        <!-- انتخاب روز -->
        <div>
            <label class="block text-xs text-slate-400 mb-2">انتخاب روز:</label>
            <div class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar" id="dateContainer"></div>
        </div>

        <!-- انتخاب ساعت -->
        <div>
            <label class="block text-xs text-slate-400 mb-2">ساعت‌های خالی:</label>
            <div class="grid grid-cols-3 gap-2" id="timeContainer">
                <p class="text-xs text-slate-500 col-span-3 text-center py-2">لطفاً روز را انتخاب کنید</p>
            </div>
        </div>

        <!-- اطلاعات مشتری -->
        <div class="space-y-3 pt-2">
            <div>
                <label class="block text-xs text-slate-400 mb-1">نام و نام خانوادگی:</label>
                <input type="text" id="clientName" placeholder="مثال: علی احمدی" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">شماره تماس:</label>
                <input type="tel" id="clientPhone" placeholder="09123456789" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white" dir="ltr">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">توضیحات (اختیاری):</label>
                <input type="text" id="clientNote" placeholder="نکته خاصی اگر دارید..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white">
            </div>
        </div>

        <button onclick="submitBooking()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-white rounded-xl text-xs font-bold cursor-pointer transition-all">
            ثبت نوبت
        </button>
    </div>

<script>
    const WORKER_URL = "https://bale-sender.salar1368yb.workers.dev";
    
    // بازه‌های ۳۰ دقیقه‌ای پایه از ۱۰ صبح تا ۱۰ شب
    const baseSlots = [
        "۱۰:۰۰", "۱۰:۳۰", "۱۱:۰۰", "۱۱:۳۰", "۱۲:۰۰", "۱۲:۳۰",
        "۱۳:۰۰", "۱۳:۳۰", "۱۶:۰۰", "۱۶:۳۰", "۱۷:۰۰", "۱۷:۳۰",
        "۱۸:۰۰", "۱۸:۳۰", "۱۹:۰۰", "۱۹:۳۰", "۲۰:۰۰", "۲۰:۳۰", "۲۱:۰۰", "۲۱:۳۰"
    ];

    let selectedDate = "";
    let selectedTime = "";
    let existingBookings = [];
    let disabledSlots = [];

    async function init() {
        try {
            const resB = await fetch(`${WORKER_URL}/bookings`);
            const dataB = await resB.json();
            existingBookings = dataB.bookings || [];

            const resD = await fetch(`${WORKER_URL}/disabled-slots`);
            const dataD = await resD.json();
            disabledSlots = dataD.disabledSlots || [];
        } catch (e) {
            console.error(e);
        }
        renderCalendar();
    }

    function renderCalendar() {
        const container = document.getElementById('dateContainer');
        container.innerHTML = '';
        for (let i = 0; i < 7; i++) {
            const d = new Date();
            d.setDate(d.getDate() + i);
            const labelStr = d.toLocaleDateString('fa-IR', { weekday: 'short', month: 'short', day: 'numeric' });
            if (i === 0 && !selectedDate) selectedDate = labelStr;

            const btn = document.createElement('button');
            btn.type = "button";
            btn.className = `flex-shrink-0 p-2.5 rounded-xl border text-xs min-w-[85px] cursor-pointer ${
                selectedDate === labelStr ? 'border-emerald-500 text-emerald-400 bg-slate-800 font-bold' : 'border-slate-700 bg-slate-800 text-white'
            }`;
            btn.innerText = labelStr;
            btn.onclick = () => {
                selectedDate = labelStr;
                selectedTime = "";
                renderCalendar();
                renderTimes();
            };
            container.appendChild(btn);
        }
        renderTimes();
    }

    function onServiceChange() {
        renderTimes();
    }

    function renderTimes() {
        const container = document.getElementById('timeContainer');
        container.innerHTML = '';

        const serviceVal = document.getElementById('serviceSelect').value;
        const durationMinutes = parseInt(serviceVal.split('|')[1]); // ۳۰ یا ۶۰ دقیقه
        const slotsNeeded = durationMinutes / 30; // تعداد سانس‌های ۳۰ دقیقه‌ای مورد نیاز

        baseSlots.forEach((time, index) => {
            // بررسی اینکه آیا به اندازه زمان خدمت، سانس خالی پشت سر هم وجود دارد یا خیر
            let isAvailable = true;
            for (let j = 0; j < slotsNeeded; j++) {
                if (index + j >= baseSlots.length) {
                    isAvailable = false;
                    break;
                }
                const targetTime = baseSlots[index + j];
                const key = `${selectedDate}_${targetTime}`;

                // چک کردن اینکه آیا سانس غیرفعال است یا قبلاً رزرو شده
                if (disabledSlots.includes(key)) {
                    isAvailable = false;
                    break;
                }
                const isBooked = existingBookings.some(b => b.date === selectedDate && b.time.includes(targetTime));
                if (isBooked) {
                    isAvailable = false;
                    break;
                }
            }

            const timeBtn = document.createElement('button');
            timeBtn.type = "button";
            timeBtn.className = `p-2.5 rounded-xl border text-xs cursor-pointer text-center ${
                !isAvailable ? 'opacity-40 border-slate-800 bg-slate-900 text-slate-600 cursor-not-allowed' :
                selectedTime === time ? 'border-emerald-500 bg-emerald-500/20 text-emerald-400 font-bold' :
                'border-slate-700 bg-slate-800 text-slate-200 hover:border-slate-500'
            }`;
            timeBtn.innerText = time;

            if (isAvailable) {
                timeBtn.onclick = () => {
                    selectedTime = time;
                    renderTimes();
                };
            } else {
                timeBtn.disabled = true;
            }
            container.appendChild(timeBtn);
        });
    }

    async function submitBooking() {
        const name = document.getElementById('clientName').value.trim();
        const phone = document.getElementById('clientPhone').value.trim();
        const note = document.getElementById('clientNote').value.trim() || 'ندارد';
        const serviceFull = document.getElementById('serviceSelect').value.split('|')[0];

        if (!name || !phone) {
            alert('لطفاً نام و شماره تماس خود را وارد کنید.');
            return;
        }
        if (!selectedTime) {
            alert('لطفاً یک ساعت خالی انتخاب کنید.');
            return;
        }

        const bookingData = {
            name,
            phone,
            service: serviceFull,
            date: selectedDate,
            time: selectedTime,
            note
        };

        try {
            const res = await fetch(`${WORKER_URL}/book`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookingData)
            });
            if (res.ok) {
                alert('نوبت شما با موفقیت ثبت شد!');
                location.reload();
            } else {
                alert('خطا در ثبت نوبت. لطفاً دوباره تلاش کنید.');
            }
        } catch (e) {
            alert('خطا در ارتباط با سرور');
        }
    }

    init();
</script>
</body>
</html>
