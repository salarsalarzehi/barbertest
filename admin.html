<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - تست</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/yekan-bakh@main/css/yekan-bakh.css" rel="stylesheet" />
    <style> body { font-family: 'Yekan Bakh', sans-serif; background-color: #0f172a; color: #f8fafc; } </style>
</head>
<body class="p-6 max-w-lg mx-auto text-center space-y-4">
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
        <h1 class="text-lg font-bold text-emerald-400">پنل مدیریت پیرایش سالار</h1>
        <p class="text-sm text-slate-400 mt-2">صفحه با موفقیت بارگذاری شد!</p>
        <button onclick="loadWorkerData()" class="mt-4 px-4 py-2 bg-emerald-500 text-white rounded-xl text-xs font-bold">تست اتصال به کلادفلر ورکر</button>
        <div id="result" class="mt-4 text-xs text-slate-300"></div>
    </div>

    <script>
        const WORKER_URL = "https://bale-sender.salar1368yb.workers.dev";
        async function loadWorkerData() {
            try {
                const res = await fetch(`${WORKER_URL}/bookings`);
                const data = await res.json();
                document.getElementById('result').innerText = "تصال موفق! تعداد رزروها: " + (data.bookings ? data.bookings.length : 0);
            } catch(e) {
                document.getElementById('result').innerText = "خطا در اتصال به ورکر: " + e.message;
            }
        }
    </script>
</body>
</html>
