<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت رزروها - پیرایش سالار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/yekan-bakh@main/css/yekan-bakh.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body { font-family: 'Yekan Bakh', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto space-y-6">

    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex items-center justify-between">
        <h1 class="text-base font-bold text-white"><i class="fa-solid fa-user-gear text-emerald-400 ml-2"></i>مدیریت نوبت‌ها و ساعات کاری</h1>
        <button onclick="loadData()" class="text-xs bg-slate-800 px-3 py-2 rounded-xl border border-slate-700 text-slate-300 cursor-pointer">
            <i class="fa-solid fa-rotate-right ml-1"></i> بروزرسانی
        </button>
    </div>

    <!-- تنظیمات ساعات کاری کلی -->
    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
        <h2 class="text-xs font-bold text-slate-300 border-b border-slate-800 pb-2">
            <i class="fa-solid fa-sliders text-cyan-400 ml-1"></i> تعریف لیست ساعت‌های هر روز (۱۰ صبح تا ۱۰ شب)
        </h2>
        <div class="flex gap-2">
            <input type="text" id="workingHoursInput" value="۱۰:۰۰, ۱۰:۳۰, ۱۱:۰۰, ۱۱:۳۰, ۱۲:۰۰, ۱۲:۳۰, ۱۶:۰۰, ۱۶:۳۰, ۱۷:۰۰, ۱۷:۳۰, ۱۸:۰۰, ۱۸:۳۰, ۱۹:۰۰, ۱۹:۳۰, ۲۰:۰۰, ۲۰:۳۰, ۲۱:۰۰, ۲۱:۳۰, ۲۲:۰۰" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white" dir="ltr">
            <button onclick="saveWorkingHours()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap">ذخیره تایم‌ها</button>
        </div>
        <p class="text-[11px] text-slate-400">می‌توانید فاصله ۳۰ دقیقه‌ای یا هر تایم دیگری را با کاما (,) جدا کرده و ذخیره کنید.</p>
    </div>

    <!-- بستن سانس‌ها در روزهای خاص -->
    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
        <h2 class="text-xs font-bold text-slate-300 border-b border-slate-800 pb-2">
            <i class="fa-solid fa-clock text-amber-400 ml-1"></i> بستن یا باز کردن سانس‌های روزانه (استراحت، کار شخصی و...)
        </h2>
        <div>
            <label class="block text-xs text-slate-400 mb-2">انتخاب روز:</label>
            <div class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar" id="adminDateContainer"></div>
        </div>
        <div class="pt-2">
            <label class="block text-xs text-slate-400 mb-2">لیست سانس‌ها (برای بستن یا باز کردن هر ساعت، روی آن کلیک کنید):</label>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" id="adminTimeContainer"></div>
        </div>
        <button onclick="saveDisabledSlots()" class="w-full mt-3 py-2.5 bg-emerald-500 text-white rounded-xl text-xs font-bold cursor-pointer">
            ذخیره تغییرات بسته بودن این روز
        </button>
    </div>

    <!-- لیست رزروها -->
    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
        <h2 class="text-xs font-bold text-slate-300 border-b border-slate-800 pb-2">
            <i class="fa-solid fa-list-check text-emerald-400 ml-1"></i> رزروهای ثبت شده مشتریان
        </h2>
        <div id="bookingList" class="space-y-2">
            <p class="text-xs text-slate-500 text-center py-4">در حال دریافت رزروها...</p>
        </div>
    </div>

<script>
    const WORKER_URL = "https://bale-sender.salar1368yb.workers.dev";
    let times = [
        "۱۰:۰۰", "۱۰:۳۰", "۱۱:۰۰", "۱۱:۳۰", "۱۲:۰۰", "۱۲:۳۰", 
        "۱۶:۰۰", "۱۶:۳۰", "۱۷:۰۰", "۱۷:۳۰", "۱۸:۰۰", "۱۸:۳۰", 
        "۱۹:۰۰", "۱۹:۳۰", "۲۰:۰۰", "۲۰:۳۰", "۲۱:۰۰", "۲۱:۳۰", "۲۲:۰۰"
    ];
    let disabledSlots = [];
    let selectedAdminDate = "";

    async function loadData() {
        const d = new Date();
        selectedAdminDate = d.toLocaleDateString('fa-IR', { weekday: 'short', month: 'short', day: 'numeric' });

        try {
            const resWorking = await fetch(`${WORKER_URL}/working-hours`);
            const dataWorking = await resWorking.json();
            if (dataWorking.workingHours && dataWorking.workingHours.length > 0) {
                times = dataWorking.workingHours;
                document.getElementById('workingHoursInput').value = times.join(', ');
            }

            const resSlots = await fetch(`${WORKER_URL}/disabled-slots`);
            const dataSlots = await resSlots.json();
            disabledSlots = dataSlots.disabledSlots || [];

            renderAdminCalendar();
            renderAdminTimes();

            const resBookings = await fetch(`${WORKER_URL}/bookings`);
            const dataBookings = await resBookings.json();
            renderBookings(dataBookings.bookings || []);
        } catch (e) {
            console.error("Error:", e);
        }
    }

    async function saveWorkingHours() {
        const val = document.getElementById('workingHoursInput').value;
        const newTimes = val.split(',').map(s => s.trim()).filter(s => s);
        if (newTimes.length === 0) {
            alert('حداقل یک ساعت وارد کنید.');
            return;
        }
        try {
            await fetch(`${WORKER_URL}/working-hours`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ workingHours: newTimes })
            });
            alert('ساعات کاری با موفقیت به‌روز شد.');
            loadData();
        } catch(e) {
            alert('خطا در ذخیره‌سازی');
        }
    }

    function renderAdminCalendar() {
        const container = document.getElementById('adminDateContainer');
        container.innerHTML = '';
        for (let i = 0; i < 7; i++) {
            const d = new Date();
            d.setDate(d.getDate() + i);
            const labelStr = d.toLocaleDateString('fa-IR', { weekday: 'short', month: 'short', day: 'numeric' });
            if (i === 0 && !selectedAdminDate) selectedAdminDate = labelStr;

            const buttonEl = document.createElement('button');
            buttonEl.type = "button";
            buttonEl.className = `flex-shrink-0 p-2.5 rounded-xl border text-xs min-w-[85px] cursor-pointer ${
                selectedAdminDate === labelStr ? 'border-emerald-500 text-emerald-400 bg-slate-800 font-bold' : 'border-slate-700 bg-slate-800 text-white'
            }`;
            buttonEl.innerText = labelStr;
            buttonEl.onclick = () => {
                selectedAdminDate = labelStr;
                renderAdminCalendar();
                renderAdminTimes();
            };
            container.appendChild(buttonEl);
        }
    }

    function renderAdminTimes() {
        const container = document.getElementById('adminTimeContainer');
        container.innerHTML = '';
        times.forEach(t => {
            const key = `${selectedAdminDate}_${t}`;
            const isDisabled = disabledSlots.includes(key);
            const timeBtn = document.createElement('button');
            timeBtn.type = "button";
            timeBtn.className = `p-2.5 rounded-xl border text-xs flex items-center justify-between cursor-pointer ${
                isDisabled ? 'border-red-500/50 bg-red-500/10 text-red-400' : 'border-slate-700 bg-slate-800 text-slate-200'
            }`;
            timeBtn.innerHTML = `<span>${t}</span> <i class="fa-solid ${isDisabled ? 'fa-ban text-red-400' : 'fa-check text-emerald-400'}"></i>`;
            timeBtn.onclick = () => {
                if (disabledSlots.includes(key)) {
                    disabledSlots = disabledSlots.filter(s => s !== key);
                } else {
                    disabledSlots.push(key);
                }
                renderAdminTimes();
            };
            container.appendChild(timeBtn);
        });
    }

    async function saveDisabledSlots() {
        try {
            await fetch(`${WORKER_URL}/disabled-slots`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ disabledSlots })
            });
            alert('تغییرات ساعات ذخیره شد.');
        } catch (e) {
            alert('خطا در ارتباط با سرور');
        }
    }

    function renderBookings(bookings) {
        const list = document.getElementById('bookingList');
        if (!bookings || bookings.length === 0) {
            list.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">رزروی موجود نیست.</p>';
            return;
        }
        list.innerHTML = '';
        bookings.forEach(item => {
            const div = document.createElement('div');
            div.className = "bg-slate-800 border border-slate-700 p-3 rounded-xl flex items-center justify-between text-xs";
            div.innerHTML = `
                <div class="space-y-1">
                    <div class="font-bold text-white">${item.name} (<a href="tel:${item.phone}" class="text-emerald-400">${item.phone}</a>)</div>
                    <div class="text-slate-400">${item.service} - <span class="text-emerald-400">${item.date} (${item.time})</span></div>
                    ${item.note && item.note !== 'ندارد' ? `<div class="text-[10px] text-slate-500">توضیحات: ${item.note}</div>` : ''}
                </div>
                <button type="button" onclick="deleteBooking(${item.id})" class="text-red-400 p-2 cursor-pointer"><i class="fa-solid fa-trash-can"></i></button>
            `;
            list.appendChild(div);
        });
    }

    async function deleteBooking(id) {
        if (!confirm('آیا مطمئن هستید؟')) return;
        try {
            await fetch(`${WORKER_URL}/delete-booking`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            loadData();
        } catch(e) {}
    }

    loadData();
</script>
</body>
</html>
