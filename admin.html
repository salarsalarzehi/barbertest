<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت پیرایش سالار</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <style>
    body { font-family: 'Vazirmatn', sans-serif !important; background-color: #0f172a; color: #f8fafc; font-size: 14px; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4">
  <div class="w-full max-w-md bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border border-slate-800 flex flex-col h-[680px] relative">
    
    <!-- هدر پنل -->
    <div class="bg-slate-800 px-4 py-3 flex items-center justify-between border-b border-slate-700 text-xs">
      <span class="font-bold text-white text-sm">🛠️ پنل مدیریت پیرایش سالار</span>
      <span class="text-[11px] bg-amber-500/10 text-amber-400 px-2.5 py-0.5 rounded-full border border-amber-500/20 font-medium">مدیریت</span>
    </div>

    <!-- بدنه اصلی -->
    <div class="flex-1 overflow-y-auto p-3.5 space-y-4 custom-scrollbar">
      
      <!-- تب انتخاب بخش -->
      <div class="grid grid-cols-2 gap-2 bg-slate-800 p-1 rounded-xl">
        <button onclick="switchTab('slots')" id="tabSlotsBtn" class="py-2 text-xs font-bold rounded-lg bg-emerald-600 text-white transition">مدیریت سانس‌ها</button>
        <button onclick="switchTab('products')" id="tabProductsBtn" class="py-2 text-xs font-bold rounded-lg text-slate-400 transition">مدیریت محصولات</button>
      </div>

      <!-- بخش اول: مدیریت سانس‌ها -->
      <div id="sectionSlots" class="space-y-3">
        <h3 class="text-xs font-bold text-slate-300">مدیریت سانس‌های غیرقابل رزرو</h3>
        <p class="text-[11px] text-slate-400">روی هر سانس کلیک کنید تا وضعیت آن تغییر کند (قرمز = بسته، سبز = آزاد):</p>
        <div id="adminSlotsContainer" class="grid grid-cols-2 gap-2"></div>
      </div>

      <!-- بخش دوم: مدیریت محصولات فروشگاه -->
      <div id="sectionProducts" class="space-y-3 hidden">
        <h3 class="text-xs font-bold text-slate-300">افزودن محصول جدید</h3>
        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2.5">
          <div>
            <label class="block text-[11px] text-slate-300 mb-1">نام محصول:</label>
            <input type="text" id="prodName" placeholder="مثلا: واکس موی مات" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] text-slate-300 mb-1">قیمت:</label>
            <input type="text" id="prodPrice" placeholder="مثلا: ۲۲۰,۰۰۰ تومان" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] text-slate-300 mb-1">انتخاب عکس محصول از گالری:</label>
            <input type="file" id="prodImageFile" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-slate-300 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer">
          </div>
          <button id="addProdBtn" onclick="addProduct()" class="w-full py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-bold transition cursor-pointer">ثبت و افزودن محصول</button>
        </div>

        <h3 class="text-xs font-bold text-slate-300 mt-4">محصولات فعلی فروشگاه</h3>
        <div id="adminProductsList" class="space-y-2"></div>
      </div>

    </div>
  </div>

  <script>
    const WORKER_URL = "https://bale-sender.salar1368yb.workers.dev";
    
    const halfHourSlots = [
      "۱۰:۰۰ - ۱۰:۳۰", "۱۰:۳۰ - ۱۱:۰۰", "۱۱:۰۰ - ۱۱:۳۰", "۱۱:۳۰ - ۱۲:۰۰", 
      "۱۲:۰۰ - ۱۲:۳۰", "۱۲:۳۰ - ۱۳:۰۰", "۱۶:۰۰ - ۱۶:۳۰", "۱۶:۳۰ - ۱۷:۰۰", 
      "۱۷:۰۰ - ۱۷:۳۰", "۱۷:۳۰ - ۱۸:۰۰", "۱۸:۰۰ - ۱۸:۳۰", "۱۸:۳۰ - ۱۹:۰۰", 
      "۱۹:۰۰ - ۱۹:۳۰", "۱۹:۳۰ - ۲۰:۰۰"
    ];

    let disabledSlots = [];
    let customProducts = [];

    function switchTab(tab) {
      if (tab === 'slots') {
        document.getElementById('sectionSlots').classList.remove('hidden');
        document.getElementById('sectionProducts').classList.add('hidden');
        document.getElementById('tabSlotsBtn').className = "py-2 text-xs font-bold rounded-lg bg-emerald-600 text-white transition";
        document.getElementById('tabProductsBtn').className = "py-2 text-xs font-bold rounded-lg text-slate-400 transition";
      } else {
        document.getElementById('sectionSlots').classList.add('hidden');
        document.getElementById('sectionProducts').classList.remove('hidden');
        document.getElementById('tabProductsBtn').className = "py-2 text-xs font-bold rounded-lg bg-amber-600 text-white transition";
        document.getElementById('tabSlotsBtn').className = "py-2 text-xs font-bold rounded-lg text-slate-400 transition";
        renderAdminProducts();
      }
    }

    async function loadAdminData() {
      try {
        const res = await fetch(`${WORKER_URL}/admin-data`);
        const data = await res.json();
        disabledSlots = data.disabledSlots || [];
        customProducts = data.customProducts || [];
        renderAdminSlots();
      } catch (e) {
        console.error("خطا در دریافت اطلاعات:", e);
      }
    }

    function renderAdminSlots() {
      const container = document.getElementById('adminSlotsContainer');
      container.innerHTML = '';
      
      const todayStr = new Date().toLocaleDateString('fa-IR', { weekday: 'short', month: 'short', day: 'numeric' });

      halfHourSlots.forEach(slot => {
        const slotKey = `${todayStr}_${slot}`;
        const isDisabled = disabledSlots.includes(slotKey);

        const btn = document.createElement('button');
        btn.className = `p-2.5 rounded-xl border text-xs flex items-center justify-between transition cursor-pointer ${
          isDisabled ? 'border-rose-500/50 bg-rose-500/10 text-rose-400' : 'border-emerald-500/50 bg-emerald-500/10 text-emerald-400'
        }`;
        btn.innerHTML = `<span dir="ltr">${slot}</span><span class="font-bold">${isDisabled ? 'بسته' : 'آزاد'}</span>`;
        
        btn.onclick = async () => {
          if (isDisabled) {
            disabledSlots = disabledSlots.filter(s => s !== slotKey);
          } else {
            disabledSlots.push(slotKey);
          }
          await saveAdminData();
          renderAdminSlots();
        };
        container.appendChild(btn);
      });
    }

    function renderAdminProducts() {
      const container = document.getElementById('adminProductsList');
      container.innerHTML = '';
      if (customProducts.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-2">محصولی ثبت نشده است.</p>';
        return;
      }
      customProducts.forEach((prod, index) => {
        const div = document.createElement('div');
        div.className = "p-2.5 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-between";
        div.innerHTML = `
          <div class="flex items-center gap-2">
            <img src="${prod.image}" class="w-10 h-10 rounded-lg object-cover border border-slate-700">
            <div>
              <h4 class="text-xs font-bold text-white">${prod.name}</h4>
              <p class="text-[11px] text-amber-400">${prod.price}</p>
            </div>
          </div>
          <button onclick="deleteProduct(${index})" class="text-rose-400 hover:text-rose-300 p-2"><i class="fa-solid fa-trash text-xs"></i></button>
        `;
        container.appendChild(div);
      });
    }

    async function addProduct() {
      const name = document.getElementById('prodName').value.trim();
      const price = document.getElementById('prodPrice').value.trim();
      const fileInput = document.getElementById('prodImageFile');
      const btn = document.getElementById('addProdBtn');

      if (!name || !price || fileInput.files.length === 0) {
        alert('لطفاً نام، قیمت و عکس محصول را وارد کنید.');
        return;
      }

      const file = fileInput.files[0];
      btn.innerText = "در حال آپلود عکس...";
      btn.disabled = true;

      try {
        // آپلود عکس به سرویس ایمیج‌بورد عمومی (Imgur API)
        const formData = new FormData();
        formData.append('image', file);

        const uploadRes = await fetch('https://api.imgur.com/3/image', {
          method: 'POST',
          headers: {
            'Authorization': 'Client-ID 56024987742d4cb' // کلید عمومی عمومی ایمیج‌بورد
          },
          body: formData
        });

        const uploadData = await uploadRes.json();
        
        if (!uploadData.success) {
          throw new Error('خطا در آپلود عکس');
        }

        const imageUrl = uploadData.data.link;

        customProducts.push({ name, price, image: imageUrl, type: 'product' });
        await saveAdminData();

        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        fileInput.value = '';
        renderAdminProducts();
      } catch (e) {
        console.error("خطا:", e);
        alert('متأسفانه آپلود عکس ناموفق بود. لطفاً دوباره تلاش کنید.');
      } finally {
        btn.innerText = "ثبت و افزودن محصول";
        btn.disabled = false;
      }
    }

    async function deleteProduct(index) {
      customProducts.splice(index, 1);
      await saveAdminData();
      renderAdminProducts();
    }

    async function saveAdminData() {
      try {
        await fetch(`${WORKER_URL}/admin-update`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ disabledSlots, customProducts })
        });
      } catch (e) {
        console.error("خطا در ذخیره اطلاعات:", e);
      }
    }

    loadAdminData();
  </script>
</body>
</html>
