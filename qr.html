<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رزرو آنلاین پیرایش سالار</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/yekan-bakh@main/css/yekan-bakh.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <style>
    body { font-family: 'Yekan Bakh', sans-serif; background: #0f172a; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-slate-900 rounded-3xl border border-slate-700 shadow-2xl overflow-hidden flex flex-col">
    
    <!-- Header همراه با عکس پروفایل شما -->
    <div class="bg-slate-800 px-6 py-6 text-center border-b border-slate-700">
      <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-emerald-400 mx-auto mb-3 shadow-md">
        <img src="https://raw.githubusercontent.com/salarsalarzehi/barbertest/main/profile.jpg" alt="سالار" class="w-full h-full object-cover">
      </div>
      <h1 class="text-white font-bold text-lg">پیرایش سالار</h1>
      <p class="text-slate-400 text-sm mt-1">رزرو آنلاین نوبت</p>
    </div>

    <!-- Buttons -->
    <div class="p-6 space-y-4">
      
      <!-- باز کردن در بله -->
      <a href="https://ble.ir/testpirbot?startapp" 
         class="flex items-center justify-center gap-3 w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-bold text-sm transition-all active:scale-95 shadow-lg shadow-emerald-500/20">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        باز کردن در بله
      </a>

      <!-- باز کردن در مرورگر -->
      <a href="https://salarsalarzehi.github.io/barbertest/" 
         class="flex items-center justify-center gap-3 w-full py-4 bg-slate-800 hover:bg-slate-700 text-white rounded-2xl font-bold text-sm transition-all active:scale-95 border border-slate-700">
        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
        </svg>
        باز کردن در مرورگر
      </a>

      <p class="text-center text-slate-500 text-xs pt-1 leading-relaxed">
        توصیه می‌شود از طریق <span class="text-emerald-400">بله</span> وارد شوید<br>
        تا پیام تأیید رزرو را دریافت کنید
      </p>

      <!-- بخش طراح و توسعه‌دهنده -->
      <div class="mt-4 pt-4 border-t border-slate-800 text-center text-xs text-slate-400 space-y-1.5">
        <p>طراحی و توسعه:</p>
        <div>
          <a href="https://ble.ir/salarx8" target="_blank" class="inline-block bg-slate-800 border border-slate-700 px-4 py-1.5 rounded-xl text-emerald-400 font-bold hover:bg-slate-700 transition" dir="ltr">@salarx8</a>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
