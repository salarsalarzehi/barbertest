<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <title>پیرایش سالار - انتخاب بخش</title>

<body class="min-h-screen flex items-center justify-center p-4">

                    </div>
                    <div>
                        <div class="text-sm font-bold text-white group-hover:text-amber-400">پنل مدیریت</div>
